<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Mode Notes - A/B メモアプリ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            },
            modeA: {
              light: '#3b82f6',
              bg: '#1e293b',
              accent: '#60a5fa'
            },
            modeB: {
              light: '#ec4899',
              bg: '#271f30',
              accent: '#f472b6'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .fade-enter {
      animation: fadeIn 0.2s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <div id="app" class="h-full flex flex-col relative overflow-hidden">
    
    <!-- LIST VIEW / FOLDER GRID -->
    <div id="listView" class="h-full flex flex-col max-w-6xl w-full mx-auto px-4 py-6 md:px-8">
      <!-- Header Bar -->
      <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-4 border-b border-slate-800">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent flex items-center gap-3">
            <i class="fa-solid font-normal fa-folder-closed text-blue-400"></i> Dual Notes
          </h1>
          <p class="text-slate-400 text-sm mt-1">端末にリアルタイムで自動保存される A/B モードメモ</p>
        </div>
        
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <!-- Auto Open Toggle Option (検索の左側) -->
          <label id="autoOpenContainer" class="flex items-center gap-2.5 cursor-pointer text-xs font-semibold px-3 py-1.5 rounded-xl border transition-all shrink-0 select-none bg-blue-950/40 border-blue-500/50 text-blue-300" title="新規メモ作成時に自動でエディタを開くか切り替え">
            <div class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="autoOpenToggle" class="sr-only peer" checked>
              <div class="w-8 h-4.5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-3.5 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3.5 after:w-3.5 after:transition-all peer-checked:bg-blue-600"></div>
            </div>
            <div class="flex items-center gap-1.5 whitespace-nowrap">
              <span class="hidden sm:inline text-slate-400 font-normal">作成後:</span>
              <span id="autoOpenStatusText" class="px-1.5 py-0.5 rounded text-[11px] font-bold bg-blue-500/20 text-blue-400">ON (自動で開く)</span>
            </div>
          </label>

          <!-- Search input -->
          <div class="relative flex-1 sm:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="searchInput" placeholder="メモを検索..." 
              class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
          </div>
          <!-- Create Memo Button -->
          <button id="createBtn" class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-sm shadow-lg shadow-blue-500/20 transition-all active:scale-95 shrink-0">
            <i class="fa-solid fa-plus"></i>
            <span>新規メモ</span>
          </button>
        </div>
      </header>

      <!-- Category/Tag Filter Pills -->
      <div id="categoryBar" class="flex items-center gap-2 overflow-x-auto pb-4 mb-4 text-xs scrollbar-none">
        <button data-cat="all" class="cat-pill active px-3.5 py-1.5 rounded-full bg-blue-600 text-white font-medium transition-all">すべて</button>
        <button data-cat="仕事" class="cat-pill px-3.5 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all">仕事</button>
        <button data-cat="アイデア" class="cat-pill px-3.5 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all">アイデア</button>
        <button data-cat="プライベート" class="cat-pill px-3.5 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all">プライベート</button>
        <button data-cat="学習" class="cat-pill px-3.5 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all">学習</button>
      </div>

      <!-- Notes / Folder Grid (4 Columns, Compact Vertical Height) -->
      <main class="flex-1 overflow-y-auto pr-1">
        <div id="memoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-12">
          <!-- Dynamic Memos Inserted Here -->
        </div>
        
        <!-- Empty State (Hidden by default) -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
          <div class="w-20 h-20 bg-slate-800/60 rounded-full flex items-center justify-center text-slate-600 mb-4 text-3xl">
            <i class="fa-regular fa-folder-open"></i>
          </div>
          <h3 class="text-lg font-medium text-slate-300 mb-1">メモが見つかりません</h3>
          <p class="text-sm text-slate-500 max-w-sm mb-6">新規メモを作成して、AモードとBモードでアイデアやメモを整理しましょう。</p>
          <button id="emptyCreateBtn" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-xl font-medium transition-all">
            最初のメモを作成
          </button>
        </div>
      </main>
    </div>

    <!-- FULLSCREEN EDITOR VIEW (Hidden initially) -->
    <div id="editorView" class="hidden fixed inset-0 z-50 bg-slate-950 flex-col overflow-hidden fade-enter">
      
      <!-- Editor Top Navigation Bar -->
      <header class="h-16 px-4 md:px-8 border-b border-slate-800 bg-slate-900/90 backdrop-blur flex items-center justify-between gap-4 shrink-0">
        <!-- Back Button & Folder Info -->
        <div class="flex items-center gap-3">
          <button id="backToListBtn" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors flex items-center gap-2 text-sm font-medium">
            <i class="fa-solid fa-arrow-left"></i>
            <span class="hidden sm:inline">一覧へ戻る</span>
          </button>
          <div class="h-4 w-px bg-slate-800"></div>
          <!-- Folder Badge -->
          <span id="editorCategoryBadge" class="text-xs px-2.5 py-1 rounded-md bg-slate-800 text-blue-400 font-medium border border-slate-700/50">
            仕事
          </span>
        </div>

        <!-- MODE SWITCHER (Center Top) -->
        <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800/80 shadow-inner">
          <button id="modeABtn" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-blue-600 text-white shadow-md">
            <i class="fa-solid fa-font"></i>
            <span>Aモード</span>
            <span class="text-[10px] opacity-75 hidden md:inline">(表メモ)</span>
          </button>
          <button id="modeBBtn" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-bold"></i>
            <span>Bモード</span>
            <span class="text-[10px] opacity-75 hidden md:inline">(裏メモ)</span>
          </button>
        </div>

        <!-- Actions & Auto-save Status (Right Top) -->
        <div class="flex items-center gap-3">
          <!-- Auto Save Indicator Badge -->
          <div id="saveStatus" class="flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 px-2.5 py-1 rounded-full">
            <i class="fa-solid fa-check text-[10px]"></i>
            <span id="saveStatusText">端末保存済み</span>
          </div>

          <!-- Actions Menu -->
          <div class="relative">
            <button id="deleteNoteBtn" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-lg transition-colors" title="このメモを削除">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Editor Main Container -->
      <div class="flex-1 flex flex-col max-w-4xl w-full mx-auto p-4 md:p-8 overflow-y-auto">
        
        <!-- Note Title & Category Selection -->
        <div class="mb-6 space-y-3">
          <div class="flex items-center gap-3">
            <!-- Icon/Color indicator -->
            <div id="memoColorDot" class="w-4 h-4 rounded-full bg-blue-500 shrink-0"></div>
            <input type="text" id="memoTitleInput" placeholder="無題のメモ" 
              class="w-full bg-transparent text-2xl md:text-3xl font-bold text-slate-100 placeholder-slate-600 border-none outline-none focus:ring-0">
          </div>
          <div class="flex items-center gap-4 text-xs text-slate-500 px-7">
            <div class="flex items-center gap-2">
              <span>カテゴリ:</span>
              <select id="memoCategorySelect" class="bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-300 focus:outline-none focus:border-blue-500">
                <option value="仕事">仕事</option>
                <option value="アイデア">アイデア</option>
                <option value="プライベート">プライベート</option>
                <option value="学習">学習</option>
              </select>
            </div>
            <span id="lastUpdatedText">更新: --</span>
          </div>
        </div>

        <!-- MODE INDICATOR BANNER -->
        <div id="modeBanner" class="mb-4 px-4 py-2.5 rounded-xl border flex items-center justify-between text-xs transition-colors bg-blue-950/30 border-blue-800/40 text-blue-300">
          <div class="flex items-center gap-2">
            <i id="modeIcon" class="fa-solid fa-circle-info"></i>
            <span id="modeDescription">現在 <strong>Aモード</strong> を編集しています（メインアイデア・概要など）</span>
          </div>
          <span id="charCount" class="font-mono text-slate-400">0 文字</span>
        </div>

        <!-- DUAL TEXTAREAS (Mode A & Mode B) -->
        <div class="flex-1 flex flex-col relative min-h-[350px]">
          <!-- MODE A TEXTAREA -->
          <textarea id="textareaA" placeholder="Aモードのテキストを入力してください...&#10;例: アプリの企画概要、メインのメモ、公開用テキストなど"
            class="w-full flex-1 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500/80 focus:ring-1 focus:ring-blue-500/80 resize-none font-sans leading-relaxed text-base transition-all"></textarea>

          <!-- MODE B TEXTAREA (Hidden by default) -->
          <textarea id="textareaB" placeholder="Bモードのテキストを入力してください...&#10;例: 開発用TODO、裏メモ、補足事項、秘密の注記など"
            class="hidden w-full flex-1 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500/80 focus:ring-1 focus:ring-pink-500/80 resize-none font-sans leading-relaxed text-base transition-all"></textarea>
        </div>

      </div>

      <!-- Editor Footer Status -->
      <footer class="h-10 px-6 border-t border-slate-900 bg-slate-950/60 flex items-center justify-between text-xs text-slate-500 shrink-0">
        <div>モード切り替え: 画面上部のタブ、またはキーボードショートカット (Alt+A / Alt+B)</div>
        <div class="flex items-center gap-4">
          <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-500"></span> Aモード</span>
          <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-pink-500"></span> Bモード</span>
        </div>
      </footer>
    </div>

    <!-- Confirmation Modal for Deletion -->
    <div id="deleteModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
        <div class="w-12 h-12 bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center text-xl mb-4">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-100 mb-2">メモを削除しますか？</h3>
        <p class="text-slate-400 text-sm mb-6">この操作は取り消せません。Aモード・Bモード両方のデータが消去されます。</p>
        <div class="flex items-center justify-end gap-3">
          <button id="cancelDeleteBtn" class="px-4 py-2 rounded-xl text-slate-300 hover:bg-slate-800 text-sm font-medium transition-colors">
            キャンセル
          </button>
          <button id="confirmDeleteBtn" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium transition-colors">
            削除する
          </button>
        </div>
      </div>
    </div>

    <!-- Long Press / Context Menu Popup -->
    <div id="contextMenuModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4" style="animation: fadeIn 0.15s ease-out;">
      <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-xs w-full p-3 shadow-2xl divide-y divide-slate-800 space-y-1">
        <div class="px-3 py-2 text-xs font-semibold text-slate-400 flex items-center justify-between">
          <span id="contextMenuTitle" class="truncate pr-2">メモ操作</span>
          <span class="text-[10px] text-slate-500">長押しメニュー</span>
        </div>
        <div class="pt-1 space-y-1">
          <button id="pinContextBtn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-200 hover:bg-slate-800 transition-colors text-left">
            <i class="fa-solid fa-thumbtack text-amber-400 w-4"></i>
            <span id="pinContextText">固定する（ピン留め）</span>
          </button>
          <button id="deleteContextBtn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-950/40 transition-colors text-left">
            <i class="fa-regular fa-trash-can w-4"></i>
            <span>削除する</span>
          </button>
        </div>
        <div class="pt-1">
          <button id="closeContextBtn" class="w-full py-2 text-xs font-medium text-slate-400 hover:text-slate-200 text-center">
            キャンセル
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Application State Management
    const STORAGE_KEY = 'dual_mode_notes_data_v1';
    const AUTO_OPEN_KEY = 'dual_mode_notes_auto_open_v1';
    let memos = [];
    let currentMemoId = null;
    let contextTargetMemoId = null; // For Long Press Context Menu
    let currentMode = 'A'; // 'A' or 'B'
    let saveTimeout = null;
    let selectedCategoryFilter = 'all';
    let searchQuery = '';
    let autoOpenNewNote = true;

    // Sample Initial Data if Empty
    const initialSampleData = [
      {
        id: 'sample-1',
        title: '新機能開発ミーティングノート',
        category: '仕事',
        color: '#3b82f6',
        isPinned: true,
        contentA: '【Aモード：アジェンダと決定事項】\n1. UIデザインの最終確認\n2. データベース構成の改修案\n3. 来週のリリーススケジュールの決定\n\n■ 決定項目\n- ボタンレスポンスを100ms以内に抑える\n- タブ切り替えのアニメーション速度を調整',
        contentB: '【Bモード：裏タスク & 感想・ネクストステップ】\n- 仕様漏れがないか再度テストコードを確認する\n- 山田さんにAPI仕様書を共有依頼\n- 個人TODO: 週末にリファクタリング用のブランチを切る',
        updatedAt: new Date(Date.now() - 3600000).toISOString()
      },
      {
        id: 'sample-2',
        title: 'カフェ風Webデザインの構想',
        category: 'アイデア',
        color: '#ec4899',
        isPinned: false,
        contentA: '【Aモード：デザインコンセプト】\n- 温かみのあるベージュとダークブラウン基調\n- レトロモダンなフォントスタイル\n- 写真中心のギャラリーレイアウト',
        contentB: '【Bモード：カラーコード＆参考CSS】\n- Primary: #d97706\n- Background: #fef3c7\n- Text: #292524\n- Google Fonts: Playfair Display + Noto Serif JP',
        updatedAt: new Date(Date.now() - 86400000).toISOString()
      }
    ];

    // DOM Elements
    const listView = document.getElementById('listView');
    const editorView = document.getElementById('editorView');
    const memoGrid = document.getElementById('memoGrid');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const createBtn = document.getElementById('createBtn');
    const emptyCreateBtn = document.getElementById('emptyCreateBtn');
    const backToListBtn = document.getElementById('backToListBtn');
    const categoryBar = document.getElementById('categoryBar');
    const autoOpenToggle = document.getElementById('autoOpenToggle');
    const autoOpenContainer = document.getElementById('autoOpenContainer');
    const autoOpenStatusText = document.getElementById('autoOpenStatusText');

    // Context Menu Elements
    const contextMenuModal = document.getElementById('contextMenuModal');
    const contextMenuTitle = document.getElementById('contextMenuTitle');
    const pinContextBtn = document.getElementById('pinContextBtn');
    const pinContextText = document.getElementById('pinContextText');
    const deleteContextBtn = document.getElementById('deleteContextBtn');
    const closeContextBtn = document.getElementById('closeContextBtn');

    // Editor DOM Elements
    const modeABtn = document.getElementById('modeABtn');
    const modeBBtn = document.getElementById('modeBBtn');
    const modeBanner = document.getElementById('modeBanner');
    const modeIcon = document.getElementById('modeIcon');
    const modeDescription = document.getElementById('modeDescription');
    const textareaA = document.getElementById('textareaA');
    const textareaB = document.getElementById('textareaB');
    const memoTitleInput = document.getElementById('memoTitleInput');
    const memoCategorySelect = document.getElementById('memoCategorySelect');
    const editorCategoryBadge = document.getElementById('editorCategoryBadge');
    const memoColorDot = document.getElementById('memoColorDot');
    const lastUpdatedText = document.getElementById('lastUpdatedText');
    const charCount = document.getElementById('charCount');
    const saveStatus = document.getElementById('saveStatus');
    const saveStatusText = document.getElementById('saveStatusText');
    const deleteNoteBtn = document.getElementById('deleteNoteBtn');

    // Modal Elements
    const deleteModal = document.getElementById('deleteModal');
    const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
    const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

    // Initialize App Data
    function initApp() {
      // Load Auto Open Setting
      const savedAutoOpen = localStorage.getItem(AUTO_OPEN_KEY);
      if (savedAutoOpen !== null) {
        autoOpenNewNote = savedAutoOpen === 'true';
      }
      if (autoOpenToggle) {
        autoOpenToggle.checked = autoOpenNewNote;
        updateAutoOpenUI(autoOpenNewNote);
      }

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          memos = JSON.parse(saved);
        } catch (e) {
          console.error('Failed to parse saved notes', e);
          memos = initialSampleData;
        }
      } else {
        memos = initialSampleData;
        saveToLocalStorage();
      }
      renderMemoGrid();
      setupEventListeners();
    }

    // Update Auto Open UI Badge
    function updateAutoOpenUI(isOpen) {
      if (!autoOpenContainer || !autoOpenStatusText) return;
      if (isOpen) {
        autoOpenContainer.className = "flex items-center gap-2.5 cursor-pointer text-xs font-semibold px-3 py-1.5 rounded-xl border transition-all shrink-0 select-none bg-blue-950/40 border-blue-500/50 text-blue-300";
        autoOpenStatusText.className = "px-1.5 py-0.5 rounded text-[11px] font-bold bg-blue-500/20 text-blue-400";
        autoOpenStatusText.textContent = "ON (自動で開く)";
      } else {
        autoOpenContainer.className = "flex items-center gap-2.5 cursor-pointer text-xs font-semibold px-3 py-1.5 rounded-xl border transition-all shrink-0 select-none bg-slate-800/80 border-slate-700 text-slate-400 hover:text-slate-200";
        autoOpenStatusText.className = "px-1.5 py-0.5 rounded text-[11px] font-bold bg-slate-700 text-slate-400";
        autoOpenStatusText.textContent = "OFF (一覧にとどまる)";
      }
    }

    // Save All Data to LocalStorage
    function saveToLocalStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
    }

    // Format Date for Display
    function formatDate(dateString) {
      const d = new Date(dateString);
      if (isNaN(d.getTime())) return '';
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      if (isToday) {
        return `今日 ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
      }
      return `${d.getFullYear()}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getDate().toString().padStart(2, '0')}`;
    }

    // Render Note List Grid
    function renderMemoGrid() {
      memoGrid.innerHTML = '';
      
      let filtered = memos.filter(m => {
        const matchesCategory = selectedCategoryFilter === 'all' || m.category === selectedCategoryFilter;
        const matchesSearch = searchQuery === '' || 
          m.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          m.contentA.toLowerCase().includes(searchQuery.toLowerCase()) ||
          m.contentB.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      // Sort pinned memos first, maintaining array order otherwise
      filtered.sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        memoGrid.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');
      memoGrid.classList.remove('hidden');

      filtered.forEach(memo => {
        const card = document.createElement('div');
        // Compact styling with long press feedback & pin indicator
        card.className = `group relative bg-slate-800/60 hover:bg-slate-800 border ${memo.isPinned ? 'border-amber-500/50 bg-amber-950/10' : 'border-slate-700/60 hover:border-slate-600'} rounded-xl p-3.5 cursor-pointer transition-all duration-200 flex flex-col justify-between hover:shadow-lg hover:shadow-blue-950/30 hover:-translate-y-0.5 select-none`;
        
        const previewTextA = memo.contentA ? memo.contentA.trim().replace(/\n/g, ' ') : '未入力';
        const previewTextB = memo.contentB ? memo.contentB.trim().replace(/\n/g, ' ') : '未入力';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="flex items-center gap-1.5 overflow-hidden">
                ${memo.isPinned ? '<span class="text-amber-400 text-xs shrink-0" title="固定されたメモ"><i class="fa-solid fa-thumbtack"></i></span>' : ''}
                <span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-700/80 text-blue-300 font-medium border border-slate-600/50 truncate">
                  ${memo.category || '未分類'}
                </span>
              </div>
              <span class="text-[10px] text-slate-500 font-mono shrink-0">${formatDate(memo.updatedAt)}</span>
            </div>
            <h3 class="text-sm font-bold text-slate-100 mb-2 line-clamp-1 group-hover:text-blue-400 transition-colors">
              ${memo.title || '無題のメモ'}
            </h3>
            
            <!-- Compact A / B Preview Box -->
            <div class="space-y-1.5 my-2 text-[11px]">
              <div class="bg-slate-900/80 rounded-md px-2 py-1 border border-slate-800/80 flex items-center gap-1.5">
                <span class="font-bold text-blue-400 shrink-0 text-[10px]">A</span>
                <p class="text-slate-400 truncate flex-1">${escapeHtml(previewTextA)}</p>
              </div>
              <div class="bg-slate-900/80 rounded-md px-2 py-1 border border-slate-800/80 flex items-center gap-1.5">
                <span class="font-bold text-pink-400 shrink-0 text-[10px]">B</span>
                <p class="text-slate-400 truncate flex-1">${escapeHtml(previewTextB)}</p>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between text-[11px] text-slate-500 pt-2 border-t border-slate-800/80 mt-1">
            <span class="flex items-center gap-1 text-[10px] text-slate-400"><i class="fa-solid fa-hard-drive text-emerald-500/80"></i> 端末保存中</span>
            <span class="text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity font-medium flex items-center gap-1 text-[10px]">
              開く <i class="fa-solid fa-chevron-right text-[8px]"></i>
            </span>
          </div>
        `;

        // Handle Click vs Long Press
        let pressTimer = null;
        let isLongPress = false;

        const startPress = (e) => {
          isLongPress = false;
          pressTimer = setTimeout(() => {
            isLongPress = true;
            if (navigator.vibrate) navigator.vibrate(40);
            openContextMenu(memo);
          }, 500); // 500ms for long press
        };

        const cancelPress = () => {
          if (pressTimer) clearTimeout(pressTimer);
        };

        // Touch Events
        card.addEventListener('touchstart', startPress, { passive: true });
        card.addEventListener('touchend', (e) => {
          cancelPress();
          if (!isLongPress) openEditor(memo.id);
        });
        card.addEventListener('touchmove', cancelPress);

        // Mouse Events
        card.addEventListener('mousedown', (e) => {
          if (e.button === 0) startPress(e);
        });
        card.addEventListener('mouseup', (e) => {
          cancelPress();
          if (!isLongPress && e.button === 0) openEditor(memo.id);
        });
        card.addEventListener('mouseleave', cancelPress);

        // Right Click Context Menu for Desktop
        card.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          cancelPress();
          openContextMenu(memo);
        });

        memoGrid.appendChild(card);
      });
    }

    // Context Menu Functions
    function openContextMenu(memo) {
      contextTargetMemoId = memo.id;
      contextMenuTitle.textContent = memo.title || '無題のメモ';
      
      if (memo.isPinned) {
        pinContextText.textContent = 'ピン留め解除';
        pinContextBtn.querySelector('i').className = "fa-solid fa-thumbtack-slash text-slate-400 w-4";
      } else {
        pinContextText.textContent = '固定する（ピン留め）';
        pinContextBtn.querySelector('i').className = "fa-solid fa-thumbtack text-amber-400 w-4";
      }

      contextMenuModal.classList.remove('hidden');
    }

    function closeContextMenu() {
      contextMenuModal.classList.add('hidden');
      contextTargetMemoId = null;
    }

    function togglePinMemo() {
      if (!contextTargetMemoId) return;
      const memo = memos.find(m => m.id === contextTargetMemoId);
      if (memo) {
        memo.isPinned = !memo.isPinned;
        saveToLocalStorage();
        renderMemoGrid();
      }
      closeContextMenu();
    }

    // Utility: HTML Escaping
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // Open Editor View
    function openEditor(id) {
      currentMemoId = id;
      const memo = memos.find(m => m.id === id);
      if (!memo) return;

      memoTitleInput.value = memo.title || '';
      memoCategorySelect.value = memo.category || '仕事';
      textareaA.value = memo.contentA || '';
      textareaB.value = memo.contentB || '';
      lastUpdatedText.textContent = `更新: ${formatDate(memo.updatedAt)}`;

      // Default to Mode A on open
      switchMode('A');

      // Update Top Badges
      updateEditorHeader();

      // Show Fullscreen Editor View
      editorView.classList.remove('hidden');
      editorView.classList.add('flex');
    }

    // Close Editor View and Return to Grid
    function closeEditor() {
      // Trigger any pending autosave immediately
      if (saveTimeout) {
        clearTimeout(saveTimeout);
        performAutoSave();
      }
      editorView.classList.add('hidden');
      editorView.classList.remove('flex');
      currentMemoId = null;
      renderMemoGrid();
    }

    // Switch between Mode A and Mode B
    function switchMode(mode) {
      currentMode = mode;

      if (mode === 'A') {
        // Mode A Styling
        modeABtn.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-blue-600 text-white shadow-md shadow-blue-600/30";
        modeBBtn.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200";

        textareaA.classList.remove('hidden');
        textareaB.classList.add('hidden');
        textareaA.focus();

        modeBanner.className = "mb-4 px-4 py-2.5 rounded-xl border flex items-center justify-between text-xs transition-colors bg-blue-950/30 border-blue-800/40 text-blue-300";
        modeIcon.className = "fa-solid fa-font text-blue-400";
        modeDescription.innerHTML = "現在 <strong>Aモード</strong> を編集しています（メインのメモ・概要など）";

      } else {
        // Mode B Styling
        modeBBtn.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-pink-600 text-white shadow-md shadow-pink-600/30";
        modeABtn.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200";

        textareaB.classList.remove('hidden');
        textareaA.classList.add('hidden');
        textareaB.focus();

        modeBanner.className = "mb-4 px-4 py-2.5 rounded-xl border flex items-center justify-between text-xs transition-colors bg-pink-950/30 border-pink-800/40 text-pink-300";
        modeIcon.className = "fa-solid fa-bold text-pink-400";
        modeDescription.innerHTML = "現在 <strong>Bモード</strong> を編集しています（裏メモ・開発TODO・追記など）";
      }

      updateCharCount();
    }

    // Update Header Category & Color
    function updateEditorHeader() {
      const category = memoCategorySelect.value;
      editorCategoryBadge.textContent = category;
      
      const colors = {
        '仕事': '#3b82f6',
        'アイデア': '#ec4899',
        'プライベート': '#10b981',
        '学習': '#f59e0b'
      };
      memoColorDot.style.backgroundColor = colors[category] || '#3b82f6';
    }

    // Update Character Count Indicator
    function updateCharCount() {
      const activeTextarea = currentMode === 'A' ? textareaA : textareaB;
      charCount.textContent = `${activeTextarea.value.length} 文字`;
    }

    // Trigger Debounced Auto-Save
    function triggerAutoSave() {
      showSavingIndicator();
      updateCharCount();

      if (saveTimeout) clearTimeout(saveTimeout);

      // Fast response auto-save to browser localstorage (300ms)
      saveTimeout = setTimeout(() => {
        performAutoSave();
      }, 300);
    }

    // Perform Auto Save to Model & LocalStorage
    function performAutoSave() {
      if (!currentMemoId) return;

      const memo = memos.find(m => m.id === currentMemoId);
      if (!memo) return;

      memo.title = memoTitleInput.value.trim() || '無題のメモ';
      memo.category = memoCategorySelect.value;
      memo.contentA = textareaA.value;
      memo.contentB = textareaB.value;
      memo.updatedAt = new Date().toISOString();

      saveToLocalStorage();
      showSavedIndicator();
      lastUpdatedText.textContent = `更新: ${formatDate(memo.updatedAt)}`;
    }

    // Save Indicator Visuals
    function showSavingIndicator() {
      saveStatus.className = "flex items-center gap-1.5 text-xs text-amber-400 bg-amber-950/40 border border-amber-800/40 px-2.5 py-1 rounded-full animate-pulse";
      saveStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-[10px]"></i> <span>端末に保存中...</span>`;
    }

    function showSavedIndicator() {
      saveStatus.className = "flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 px-2.5 py-1 rounded-full transition-all";
      saveStatus.innerHTML = `<i class="fa-solid fa-check text-[10px]"></i> <span>端末保存済み</span>`;
    }

    // Create New Note (Appends to the END of the list)
    function createNewNote() {
      const newMemo = {
        id: 'memo-' + Date.now(),
        title: '',
        category: selectedCategoryFilter !== 'all' ? selectedCategoryFilter : '仕事',
        color: '#3b82f6',
        isPinned: false,
        contentA: '',
        contentB: '',
        updatedAt: new Date().toISOString()
      };

      // Append to the end of the array as requested
      memos.push(newMemo);
      saveToLocalStorage();
      renderMemoGrid();

      // Open editor only if autoOpenNewNote setting is enabled
      if (autoOpenNewNote) {
        openEditor(newMemo.id);
      }
    }

    // Delete Note Logic
    function deleteCurrentNote() {
      if (!currentMemoId) return;
      memos = memos.filter(m => m.id !== currentMemoId);
      saveToLocalStorage();
      deleteModal.classList.add('hidden');
      closeEditor();
    }

    // Event Listeners Setup
    function setupEventListeners() {
      // Auto Open Setting Toggle Switch
      if (autoOpenToggle) {
        autoOpenToggle.addEventListener('change', (e) => {
          autoOpenNewNote = e.target.checked;
          localStorage.setItem(AUTO_OPEN_KEY, String(autoOpenNewNote));
          updateAutoOpenUI(autoOpenNewNote);
        });
      }

      // Context Menu Listeners
      pinContextBtn.addEventListener('click', togglePinMemo);
      deleteContextBtn.addEventListener('click', () => {
        if (!contextTargetMemoId) return;
        currentMemoId = contextTargetMemoId;
        closeContextMenu();
        deleteModal.classList.remove('hidden');
      });
      closeContextBtn.addEventListener('click', closeContextMenu);
      contextMenuModal.addEventListener('click', (e) => {
        if (e.target === contextMenuModal) closeContextMenu();
      });

      // Create Note Buttons
      createBtn.addEventListener('click', createNewNote);
      emptyCreateBtn.addEventListener('click', createNewNote);

      // Back to List
      backToListBtn.addEventListener('click', closeEditor);

      // Mode Switching Buttons
      modeABtn.addEventListener('click', () => switchMode('A'));
      modeBBtn.addEventListener('click', () => switchMode('B'));

      // Auto-save input listeners
      textareaA.addEventListener('input', triggerAutoSave);
      textareaB.addEventListener('input', triggerAutoSave);
      memoTitleInput.addEventListener('input', triggerAutoSave);
      memoCategorySelect.addEventListener('change', () => {
        updateEditorHeader();
        triggerAutoSave();
      });

      // Filter Category Pills
      categoryBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.cat-pill');
        if (!btn) return;

        document.querySelectorAll('.cat-pill').forEach(b => {
          b.className = "cat-pill px-3.5 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all";
        });
        btn.className = "cat-pill active px-3.5 py-1.5 rounded-full bg-blue-600 text-white font-medium transition-all";

        selectedCategoryFilter = btn.dataset.cat;
        renderMemoGrid();
      });

      // Search Filter Input
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderMemoGrid();
      });

      // Delete Modal Trigger
      deleteNoteBtn.addEventListener('click', () => {
        deleteModal.classList.remove('hidden');
      });
      cancelDeleteBtn.addEventListener('click', () => {
        deleteModal.classList.add('hidden');
      });
      confirmDeleteBtn.addEventListener('click', deleteCurrentNote);

      // Keyboard Shortcuts inside Editor (Alt+A for Mode A, Alt+B for Mode B)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (!contextMenuModal.classList.contains('hidden')) {
            closeContextMenu();
            return;
          }
          if (!deleteModal.classList.contains('hidden')) {
            deleteModal.classList.add('hidden');
            return;
          }
          if (currentMemoId) {
            closeEditor();
          }
        }
        if (!currentMemoId) return;
        if (e.altKey && (e.key === 'a' || e.key === 'A')) {
          e.preventDefault();
          switchMode('A');
        } else if (e.altKey && (e.key === 'b' || e.key === 'B')) {
          e.preventDefault();
          switchMode('B');
        }
      });
    }

    // Initialize on Page Load
    window.onload = initApp;
  </script>
</body>
</html>
